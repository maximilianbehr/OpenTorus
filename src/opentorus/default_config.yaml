# OpenTorus workspace configuration (.opentorus/config.yaml)
#
# Edit values here, or run:
#   opentorus config show
#   opentorus config set <dotted.key> <value>    # e.g. model.provider ollama
#
# Most changes apply on the next command. Invalid values raise a clear error on load.

# --- Model (LLM provider) -----------------------------------------------------
model:
  # Provider: mock | openai | anthropic | ollama
  #   mock      — offline default for tests and dry runs (no API key)
  #   openai    — needs OPENAI_API_KEY
  #   anthropic — needs ANTHROPIC_API_KEY
  #   ollama    — local server; set base_url if not http://127.0.0.1:11434
  provider: mock
  # Model id / name passed to the provider (e.g. gpt-4o, claude-sonnet-4-20250514, llama3)
  name: mock-default
  # Sampling temperature (0.0 = deterministic, higher = more varied)
  temperature: 0.2
  # Optional API base URL (required for non-default Ollama/OpenAI-compatible endpoints)
  base_url: null
  # HTTP timeout in seconds (raise for slow local models / large contexts)
  timeout_seconds: 300
  # Ollama-only: context window size (e.g. 32768). null = model default.
  num_ctx: null
  # Ollama-only sampling shape. null = keep the model's own Modelfile values, which
  # differ per model (gemma4 ships top_k 64 / top_p 0.95; mistral-medium ships neither).
  # Set both to compare models without also comparing their sampling.
  top_p: null
  top_k: null
  # Ollama-only: fix the sampler so a run can be replayed. null = unseeded. Set it for
  # before/after comparisons, where an unseeded model just takes a different route.
  seed: null
  # Ollama-only: max tokens to generate (-1 = unlimited). null = unlimited when tools are on.
  # Set with: opentorus config set model.num_predict=-1  (or --value=-1)
  num_predict: null
  # Provider-neutral cap on generated tokens per response. null = provider default.
  max_tokens: null
  # Ollama-only: keep the model loaded this long after a request ("30m", "2h", "-1" =
  # forever). null = the server's default (5 minutes) — a worker that pauses longer
  # between calls (an experiment runs) then pays a cold reload; slow on network disks.
  keep_alive: null
  # Verify the model can call tools before an agent run (one-shot probe; reads Ollama
  # /api/show). OpenTorus is useless without tool calling, so a model that cannot is
  # refused with a clear message. Set false to skip the check.
  verify_tool_calling: true

# --- Model profiles (per-task routing) ------------------------------------------
models:
  # Named model profiles for governance.routing.task_routes. The `model:` block above
  # is always available as the implicit profile "default"; set default_profile to a
  # profile name below to use that one when no route applies (null = the `model:` block).
  default_profile: null
  # profiles: a mapping of profile name -> the same keys as `model:`, plus
  #   capabilities: [tool_calling, vision, ...]   # declared capabilities (optional; needed
  #                                               # for tool calling on Ollama models)
  #   local_only: true | false                    # override the local-vs-cloud classification
  # `opentorus config set` cannot write mappings — edit this file. Example (placeholders):
  # profiles:
  #   strong:
  #     provider: <provider>
  #     name: <model-id>
  #     capabilities: [tool_calling]
  #   fast:
  #     provider: <provider>
  #     name: <model-id>
  #     base_url: <optional endpoint url>
  profiles: {}

# --- Project & agent behaviour ------------------------------------------------
project:
  # Focus hint for prompts: code | research | writing | data | mixed
  mode: mixed

agent:
  # Operating style: cautious | normal | fast | autonomous
  #   cautious    — more confirmations even in trusted mode
  #   autonomous  — fewer prompts; destructive ops still confirmed
  style: normal
  # Session mode: normal | review  (review = read-only; also overridable via --mode review)
  mode: normal
  # Max tool/model round-trips per agent turn (run / chat / REPL / prove).
  # Use a positive integer, or inf / unlimited / -1 for no cap.
  max_steps: 12
  # Minimum [parsed] papers before proof_write in opentorus prove (0 = no quota; use --min-papers N to override per run)
  prove_min_papers: 0
  # After proof_write, keep working while PROOF-* still lists gaps (until cap or gaps closed).
  prove_until_gaps_closed: true
  # Max extra model steps for gap-filling after the first sketch (important when max_steps: inf).
  # Positive integer, or inf / unlimited / -1 for no separate gap-fill cap.
  prove_gap_fill_max_steps: 48
  # Stop gap-filling after this many consecutive steps that do not reduce the gap count,
  # even if the caps above are inf. Prevents an endless grind when a model cannot close
  # gaps; a model that keeps shrinking the gap list resets the window and continues.
  # Positive integer, or inf / unlimited / -1 to disable.
  prove_gap_fill_no_progress_steps: 16
  # On every clean completion check, let the hostile referee reopen [REFEREE] gaps
  # for blocking findings (contradictions, unsupported result claims). Only active
  # while prove_until_gaps_closed.
  prove_referee_reopens_gaps: true
  # Campaign gate (opt-in): hold the clean completion of a prove run until at least
  # one experiment or one proof_submit is recorded. Forces the attempt, never the
  # outcome — a run that starts nothing is ended honestly by the no-progress window.
  prove_require_instance_work: false
  # Wall-clock budget for one agent run in seconds (null = no limit). Every other guard
  # assumes turns come back; a hung model call satisfies none of them, and with
  # max_steps: inf that repeats without bound. Checked between steps.
  max_wall_seconds: null

# --- Permissions (see also permissions.yaml) ------------------------------------
permissions:
  # Permission mode: safe | ask | trusted
  #   safe    — read-only; no writes or shell commands
  #   ask     — confirm writes, commands, and network tools (default)
  #   trusted — auto-allow low/medium-risk actions; high-risk still gated
  mode: ask

# --- Privacy ------------------------------------------------------------------
privacy:
  # Block reads of sensitive paths (.env, keys, credentials) in file tools
  sensitive_file_guard: true
  # If false, sensitive file contents are never sent to the model provider
  allow_sensitive_context: false

# --- Terminal UI --------------------------------------------------------------
ui:
  # Render inline LaTeX ($...$, $$...$$) as Unicode in the terminal
  render_math: true
  # Desktop notifications (native toast when available; terminal bell fallback)
  notifications_enabled: true
  notify_on_turn_complete: true
  notify_on_permission: true
  # Skip notifications for interactive TTY runs; background/piped runs still notify
  notify_only_unfocused: true
  notify_min_elapsed_seconds: 3

# --- Quality gates (opentorus check / verification) ---------------------------
quality:
  # Shell commands run for verification; set null to skip a gate
  test_command: pytest -q
  lint_command: ruff check .
  typecheck_command: mypy

# --- Experiment environment capture -------------------------------------------
environment:
  capture_pip_freeze: false
  capture_os_info: true
  capture_git_state: true

# --- Context window & retrieval -----------------------------------------------
context:
  retrieval_enabled: true
  top_k: 5
  # Volatile blocks (workspace inventory, retrieval hits, recovery hint) go at the END
  # of each request, so the stable head + history form a prefix a local server can reuse
  # from its KV cache. Set false to restore the old ordering (state near the front).
  stable_prefix: true
  # Recent session turns replayed verbatim into each request (less amnesia about earlier
  # papers/claims/proof steps); bounded by token_budget, which triggers compaction.
  history_turns: 50
  # History token budget before compaction. Hold the system head + a few paper reading
  # notes (~900 tokens each) + the current proof; too small (e.g. 6000) forces a
  # compaction nearly every turn during proof work. Lower it for small local models.
  token_budget: 24000
  compaction_enabled: true
  # Persistently compact session.jsonl when history exceeds this fraction of token_budget
  compaction_threshold: 0.85
  # Summarize compacted turns with the chat provider when available
  compaction_llm: true
  # Verbatim recent history kept after a session compaction (fraction of token_budget)
  compaction_keep_ratio: 0.5
  # Hybrid BM25 + provider/local embeddings (OpenAI/Ollama by default when configured)
  embeddings_enabled: true
  embeddings_backend: auto
  # Optional override when chat provider has no embed API (e.g. anthropic → ollama)
  embeddings_provider: null
  # null = provider default (text-embedding-3-small / nomic-embed-text / all-MiniLM-L6-v2)
  embeddings_model: null

# --- Tools (literature, web, MCP, datasets, code evidence) --------------------
tools:
  # External MCP servers (opt-in). Example:
  # mcp:
  #   - name: my-server
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/path"]
  #     enabled: false
  mcp: []

  literature:
    # Master switch for lit_search / paper_fetch agent tools and opentorus lit …
    enabled: true
    # Free, keyless sources (each can be turned off individually)
    openalex: true
    arxiv: true
    crossref: true
    semantic_scholar: true
    dblp: true
    zbmath: true
    # Biomedical servers — off by default (OpenTorus targets open math problems;
    # they only add 503s/timeouts for math/CS queries). Enable for biomedical work.
    europepmc: false
    biorxiv: false
    # Keyed sources (enable only after setting the matching *_api_key)
    springer: false
    ieee: false
    ads: false
    springer_api_key: null
    ieee_api_key: null
    semantic_scholar_api_key: null
    ads_api_key: null
    # Polite-pool contact for OpenAlex/Crossref (recommended for production use)
    contact_email: null
    # Optional institutional proxy base URL (e.g. EZproxy) for licensed PDFs
    proxy_base_url: null
    rate_limit_per_minute: 20
    daily_request_budget: 500

  web:
    # fetch_url and web_search agent tools
    enabled: true
    fetch: true
    search: true
    # Max characters returned per fetched page (lower = smaller prompts)
    max_chars: 8000

  verifiers:
    # Formal proof backends (opt-in; commands must be on PATH)
    lean: false
    coq: false
    smt: false
    lean_command: lake env lean
    coq_command: coqc
    smt_command: z3
    # Pure-Python backends (no external binary): validated interval arithmetic
    # and sympy symbolic checks. Enabled by default — they also register the
    # proof_submit agent tool.
    interval: true
    sympy: true

  datasets:
    enabled: true
    zenodo: true
    huggingface: true
    osf: true
    # Substring match against resolved license strings (case-insensitive)
    allowed_licenses:
      - cc0
      - cc-by
      - cc-by-sa
      - public domain
      - pddl
      - odbl
      - odc-by
      - mit
      - apache
      - bsd
    allow_unknown_license: false
    max_file_bytes: 500000000

  code_evidence:
    enabled: true
    clone_command: git
    max_repo_bytes: 500000000

# --- Where experiments and shell tools run ------------------------------------
execution:
  # Backend: auto | local | docker | podman | apptainer | ssh | slurm
  backend: auto
  # When backend=auto, try these container runtimes in order
  auto_preference:
    - docker
    - podman
    - apptainer
  network: false
  memory_limit: null
  cpu_limit: null
  cache: true
  remote:
    # Required for ssh/slurm backends (credentials stay in ~/.ssh, not here)
    host: null
    user: null
    remote_root: ~/opentorus-runs
    ssh_command: ssh
    copy_command: scp
    partition: null
    time_limit: null
    account: null
    extra_sbatch: []

# --- Governance (budgets, DLP, model routing) ---------------------------------
governance:
  # Pre-egress scan for secrets/PII before network sends (fails closed)
  dlp: true
  budgets:
    cost_budget_usd: null
    token_budget: null
    per_provider_usd: {}
  routing:
    # Per-task model routing. Off by default: every task uses the default profile.
    enabled: false
    # Legacy form: task class -> bare model name (run on the default profile's provider).
    task_models: {}
    # task class -> ordered list of profile names from models.profiles (first eligible
    # profile answers; the rest are fallbacks; "default" is the fallback route). Task
    # classes: problem_normalization, campaign_strategy, portfolio_deduplication,
    # scheduling, theorem_extraction, literature_synthesis, proof_development,
    # counterexample_search, symbolic_experiment_design, numerical_experiment_design,
    # code_generation, formalization, adversarial_critique, verification_support,
    # final_synthesis, narration, default (legacy names proof/critique/planning still
    # work). Every routing decision is recorded in .opentorus/usage/routing.jsonl.
    # `opentorus config set` cannot write mappings — edit this file. Example:
    # task_routes:
    #   proof_development: [strong, default]
    #   narration: [fast]
    task_routes: {}

# --- Campaign engine (opentorus campaign) --------------------------------------
campaign:
  # Default campaign mode: prove-or-refute | exploration | survey
  default_mode: exploration
  # Strategy proposals kept after de-duplication (--branches overrides per run)
  initial_branches: 4
  # Branches scheduled concurrently; the rest wait as "proposed"
  max_active_branches: 3
  # v1 executes work items sequentially; a larger value is capped to 1 with a diagnostic
  max_parallel_workers: 1
  # Total model turns across all workers; 0 = not configured / unlimited
  max_steps: 50
  # Wall-clock budget for the whole campaign in seconds; 0 = not configured / unlimited
  max_wall_seconds: 0
  # Token budget across all workers; 0 = not configured / unlimited
  token_budget: 0
  # USD cost budget across all workers; 0 = not configured / unlimited
  cost_budget: 0.0
  # Model turns per branch before it is marked exhausted
  branch_step_budget: 10
  # Require a literature-mapping branch before proof work is scheduled
  require_literature_mapping: true
  # Require every branch to declare its relation to the root problem
  require_root_relation: true
  # Rewrite snapshot.json after every event (false = at phase boundaries only)
  persist_every_event: true
  # Opt-in: `opentorus research` also records an exploration campaign
  record_research: false
  # Multipliers for the scheduler's documented scoring factors (1.0 = neutral)
  scheduler_weights:
    novelty: 1.0
    root_impact: 1.0
    verifier_readiness: 1.0
    dependency: 1.0
    cost: 1.0
    redundancy: 1.0
    failure: 1.0
