# Release pipeline, triggered by pushing a `vX.Y.Z` tag.
#
# Every push of a `v*` tag runs the full gate (lint, types, tests), builds the
# sdist and wheel, checks that the tag matches `opentorus.__version__`, installs
# both distributions into clean virtualenvs, produces an SBOM and a build
# provenance attestation, and uploads everything as workflow artifacts.
#
# PUBLISH GATE: nothing leaves GitHub Actions by default. The `publish` (PyPI)
# and `github-release` (draft GitHub release) jobs only run when the repository
# variable OPENTORUS_RELEASE_PUBLISH is set to the string 'true'
# (Settings > Secrets and variables > Actions > Variables). Publishing to PyPI
# additionally needs a PyPI *trusted publisher* configured for this repository
# with workflow `release.yml` and environment `pypi` -- there is no API token
# anywhere in this workflow. Until both exist, a tag push is a dry run that
# proves the release would have worked. See docs/release.md.
#
# Pinning policy: first-party `actions/*` by major tag (the repository
# convention); third-party actions by full commit SHA with the version as a
# comment, so a moved tag can never change what runs with publish credentials.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One release run per tag; never cancel a release that is half-way through
# publishing, a second push of the same tag simply queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tooling
        run: pip install build twine
      - name: Tag matches opentorus.__version__
        shell: bash
        # Read the version textually rather than importing the package: the
        # check must not depend on an install, and an import could pick up a
        # different opentorus from the runner's site-packages.
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re, sys
          text = pathlib.Path("src/opentorus/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if match is None:
              sys.exit("could not find __version__ in src/opentorus/__init__.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match opentorus.__version__ {version!r} (expected v{version})")
          print(f"tag {tag} matches version {version}")
          PY
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Assert wheel and sdist exist
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist/
          test "$(ls dist/*.whl 2>/dev/null | wc -l)" -eq 1 || { echo "expected exactly one wheel in dist/"; exit 1; }
          test "$(ls dist/*.tar.gz 2>/dev/null | wc -l)" -eq 1 || { echo "expected exactly one sdist in dist/"; exit 1; }
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install wheel into a clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-wheel
          .venv-wheel/bin/pip install --upgrade pip
          .venv-wheel/bin/pip install dist/*.whl
      - name: Wheel smoke (--version, --help, init, doctor)
        shell: bash
        run: |
          set -euo pipefail
          OT="$PWD/.venv-wheel/bin/opentorus"
          "$OT" --version
          "$OT" --help
          tmp="$(mktemp -d)"
          cd "$tmp"
          "$OT" init
          # The clean venv has no pytest; doctor would report the missing test
          # runner as a failed environment check although the package is fine.
          "$OT" config set quality.test_command null
          "$OT" doctor --json || "$OT" doctor
      - name: Import without optional deps
        shell: bash
        run: |
          set -euo pipefail
          .venv-wheel/bin/python -c "import sys, opentorus.cli; assert 'textual' not in sys.modules"
      - name: Install sdist into a second clean venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-sdist
          .venv-sdist/bin/pip install --upgrade pip
          .venv-sdist/bin/pip install dist/*.tar.gz
          .venv-sdist/bin/opentorus --version
          .venv-sdist/bin/opentorus --help
      - name: Dashboard extra
        shell: bash
        run: |
          set -euo pipefail
          .venv-wheel/bin/pip install "$(ls dist/*.whl)[dashboard]"
          .venv-wheel/bin/python -c "import textual"
          .venv-wheel/bin/python -c "import sys, opentorus.cli; assert 'textual' not in sys.modules"

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The SBOM describes what a user gets from `pip install opentorus`: the
      # wheel plus its resolved runtime dependency closure. Scanning the
      # installed site-packages is what syft catalogs reliably; a bare wheel
      # file would only yield the one package.
      - name: Install wheel for cataloguing
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-sbom
          .venv-sbom/bin/pip install --upgrade pip
          .venv-sbom/bin/pip install dist/*.whl
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .venv-sbom
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

  provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  publish:
    # Gated: skipped unless the repository variable OPENTORUS_RELEASE_PUBLISH is
    # 'true'. Uses PyPI trusted publishing (OIDC) -- no token, no password.
    needs: [install-smoke, sbom, provenance]
    if: vars.OPENTORUS_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opentorus
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    # Gated like `publish`. Creates a *draft* release so a human reviews the
    # notes and assets before anything becomes visible.
    needs: [install-smoke, sbom, provenance]
    if: vars.OPENTORUS_RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
          body: |
            Draft release for ${{ github.ref_name }}. Copy the matching section of
            CHANGELOG.md here before publishing.
          files: |
            dist/*
            sbom.spdx.json
